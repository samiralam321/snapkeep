<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapKeep</title>
  <link rel="stylesheet" href="../utils/shared.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Top Bar Controls -->
    <header class="popup-topbar">
      <div class="topbar-left">
        <span class="status-pulse-dot"></span>
        <span class="status-label">Local &bull; Offline</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-quick-clean" class="btn-topbar-icon" title="Clean Expired Screenshots">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
        <button id="btn-open-dashboard" class="btn-topbar-icon" title="Storage Dashboard">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        </button>
        <button id="btn-open-settings" class="btn-topbar-icon" title="Settings">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <!-- Centered Brand Identity (SnapQR Style) -->
    <div class="brand-hero-section">
      <div class="brand-logo-frame">
        <img src="../icons/icon48.png" alt="SnapKeep" class="hero-logo-img">
      </div>
      <h1 class="hero-app-title">SnapKeep</h1>
      <p class="hero-app-subtitle">Capture what you need. Auto-delete what doesn't.</p>
    </div>

    <!-- Notice Banner (Warns if user is on internal chrome:// or Web Store tab) -->
    <div id="popup-notice" class="popup-notice" style="display: none;">
      <span id="popup-notice-text"></span>
    </div>

    <!-- Capture Action Section -->
    <div class="capture-hero-container">
      <button id="btn-capture-visible" class="btn-hero-snap" title="Capture Visible Area (Alt+Shift+V)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        <span>Snap Screen</span>
      </button>

      <div class="secondary-actions-row">
        <button id="btn-capture-area" class="btn-secondary-snap" title="Select Area to snip (Alt+Shift+S)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v4m12-4v4M2 6h4m12 0h4M2 18h4m12 0h4M6 22v-4m12 4v-4"></path></svg>
          <span>Select Area</span>
        </button>
        <button id="btn-capture-full" class="btn-secondary-snap" title="Scroll & capture entire page (Alt+Shift+F)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
          <span>Full Page</span>
        </button>
      </div>
    </div>

    <!-- Recent Screenshot / Stage Display -->
    <div class="stage-section">
      <div id="empty-recent-state" class="empty-hero-stage">
        <div class="reticle-icon-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
        <p class="empty-hero-title">Ready to Capture</p>
        <span class="empty-hero-hint">Screenshots auto-delete after 24h</span>
      </div>

      <div id="recent-list" class="recent-hero-stage">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Minimal Storage Overview -->
    <div class="storage-compact-bar">
      <div class="storage-compact-info">
        <span class="stat-pill-item"><strong id="stat-total-count">0</strong> snaps</span>
        <span class="stat-divider">&bull;</span>
        <span class="stat-pill-item text-temp"><strong id="stat-temp-count">0</strong> temp (24h)</span>
        <span class="stat-divider">&bull;</span>
        <span class="stat-pill-item text-perm"><strong id="stat-perm-count">0</strong> perm</span>
      </div>
      <div class="storage-compact-sub">
        <span id="stat-total-bytes">0 KB used</span>
        <span class="stat-divider">&bull;</span>
        <span id="stat-scheduled-deletion">0 scheduled for cleanup</span>
      </div>
      <!-- Hidden bindings for script compatibility -->
      <div style="display: none;">
        <div id="progress-temp"></div>
        <div id="progress-perm"></div>
        <button id="btn-view-all"></button>
      </div>
    </div>

    <!-- Open Library Action -->
    <div class="popup-bottom-action">
      <button id="btn-open-library" class="btn-open-library">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Open Screenshot Library</span>
      </button>
    </div>

    <!-- Clean Subtle Footer -->
    <footer class="popup-subtle-footer">
      <span>Built for clean laptops &bull; 100% Offline</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
